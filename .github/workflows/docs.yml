name: Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'INSTALL.md'
      - 'COLLOQUIUM.md'
      - 'PROJECT.md'
      - 'REVIEW.md'
      - 'TRANSLATOR.md'
      - 'TESTING.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install .
          pip install mkdocs mkdocs-material pymdown-extensions mkdocs-autorefs mkdocstrings[python] mkdocs-literate-nav mkdocs-section-index

      - name: Generate API Documentation
        run: python scripts/generate_api_docs.py

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
