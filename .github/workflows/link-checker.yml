name: Link Checker

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/link-checker.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'README.md'
  schedule:
    - cron: "0 0 1 * 1" # Runs on the 1st of the month AND every Monday. Monthly on Mondays specifically is tricky in cron, so this ensures it runs at least monthly.

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          args: --verbose --no-progress --exclude "https://platform.openai.com/.*" --exclude "https://miktex.org/.*" './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
