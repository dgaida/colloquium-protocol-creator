# Configuration for academic-doc-generator

# Global folder where generated web metadata (*.md files) will be copied.
# This folder is always the same and does not depend on the thesis.
# Set to null to disable copying.
web_metadata_folder: null

# Default first examiner name. If set, it will be used for all documents.
# If null, the name will be extracted from the PDF.
first_examiner: null
