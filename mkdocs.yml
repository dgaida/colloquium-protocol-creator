site_name: Academic Document Generator Documentation
site_description: AI-powered generation of academic documents for TH Köln - thesis protocols, project letters, and peer reviews
site_author: Daniel Gaida
site_url: https://dgaida.github.io/colloquium-protocol-creator/

repo_name: dgaida/colloquium-protocol-creator
repo_url: https://github.com/dgaida/colloquium-protocol-creator
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - navigation.footer

plugins:
  - search
  - autorefs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: INSTALL.md
      - Configuration: configuration.md
  - Use Cases:
      - Thesis Colloquium: COLLOQUIUM.md
      - Project Grading: PROJECT.md
      - Peer Review: REVIEW.md
      - Exam Translation: TRANSLATOR.md
  - Guides:
      - Testing: TESTING.md
      - Contributing: CONTRIBUTING.md
  - API Reference:
      - Configuration Loader: api/config_loader.md
      - Core Modules: api/core.md
      - LLM Interface: api/llm_interface.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dgaida/colloquium-protocol-creator
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/colloquium-protocol-creator/

copyright: Copyright &copy; 2025 Daniel Gaida
