[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colloquium-protocol-creator"
version = "0.3.5"
description = "Create colloquium protocol letters from thesis PDFs (annotation extraction, comment rewriting, LaTeX generation) as well as paper reviews."
authors = [{name = "Daniel Gaida", email = "daniel.gaida@th-koeln.de"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "liteparse>=2.5.1",
    "pypdf>=4.0.0",
    "PyMuPDF>=1.24.0",
    "docling-parse>=0.2.0",
    "docling-core>=0.2.0",
    "PyYAML>=6.0.0",
    "llm-client @ git+https://github.com/dgaida/llm_client.git",
]

[project.scripts]
academic-doc-generator = "academic_doc_generator.cli.main:main"
colloquium-protocol-creator = "academic_doc_generator.cli.main:colloquium_main"
project-grading-letter = "academic_doc_generator.cli.main:project_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]  # Allow assert in tests

[tool.black]
line-length = 100
target-version = ['py39']
